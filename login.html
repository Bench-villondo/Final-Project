<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In | Faith in a Digital World</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="login-page">
    <section class="login-card">
      <a class="brand" href="index.html"><span>✦</span> Faith in a Digital World</a>
      <p class="eyebrow">WELCOME BACK</p>
      <h1>Log in</h1>
      <p>Enter your name and password to continue.</p>
      <form action="index.html" method="get">
        <label for="name">Your name</label>
        <input id="name" type="text" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <button class="button full" type="submit">Continue <span>→</span></button>
      </form>
      <p class="login-note">Welcome to my simple website about The final project of CS 101.</p>
    </section>
  </main>
</body>
</html>
